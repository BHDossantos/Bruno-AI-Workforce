name: Mobile build

# Builds the App Store / Google Play binaries from the same frontend the web app
# uses. Path-filtered so unrelated backend work does not spin up two runners.
on:
  push:
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version users see, e.g. 1.0.1"
        required: false
        type: string

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (AAB + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The backend URL is baked into the binary at build time, so it has to be
      # the real production API. Set it as a repo variable (Settings -> Variables
      # -> Actions), not a secret: it is public the moment the app ships.
      NEXT_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL || 'https://bruno-backend.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      - name: Build the static web bundle
        working-directory: mobile
        run: npm run build:web

      - name: Sync the Android project
        working-directory: mobile
        run: npx cap sync android

      # Always builds. Proves the native project compiles on every change, with no
      # signing material involved.
      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Decode the upload keystore
        id: keystore
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set — building the release bundle unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release bundle
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: mobile/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/upload.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: ignore
          retention-days: 14
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS (archive)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # The backend URL is baked into the binary at build time, so it has to be
      # the real production API. Set it as a repo variable (Settings -> Variables
      # -> Actions), not a secret: it is public the moment the app ships.
      NEXT_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL || 'https://bruno-backend.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      - name: Build the static web bundle
        working-directory: mobile
        run: npm run build:web

      - name: Sync the iOS project
        working-directory: mobile
        run: npx cap sync ios

      # Compiles without signing: it verifies the Xcode project, the Swift package
      # dependencies and the bundled web assets. Producing an uploadable .ipa needs
      # an Apple distribution certificate, which is a separate step once the Apple
      # Developer account exists.
      - name: Build (no code signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
